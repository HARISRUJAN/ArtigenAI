name: Build and Push Container Image to GHCR

# This workflow builds the Docker image and pushes it to GitHub Container Registry
# It can be triggered manually or automatically on push to main branches

on:
  push:
    branches:
      - main
      - master
      - Version-0.1
      - copilot/**
  workflow_dispatch:  # Allow manual triggering
  pull_request:
    branches:
      - main
      - master
      - Version-0.1

env:
  # GitHub Container Registry
  REGISTRY: ghcr.io
  # Image name (will be: ghcr.io/OWNER/IMAGE_NAME)
  IMAGE_NAME: ${{ github.repository }}/aigov-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required for pushing to GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (for tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'Version-0.1') || github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # Build from repository root
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.meta.outputs.tags }}
