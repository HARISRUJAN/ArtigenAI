name: Deploy to Azure Web App

# This workflow deploys the application to Azure Web App Service (App Service for Containers)
# It builds a Docker image containing both backend and frontend, pushes it to GitHub Container Registry,
# and deploys it to Azure Web App for Containers.

on:
  push:
    branches:
      - Version-0.1  # Change this to your main branch name if different
  workflow_dispatch:  # Allow manual triggering

env:
  # GitHub Container Registry
  REGISTRY: ghcr.io
  # Full image path for deployment (format: ghcr.io/OWNER/REPO/IMAGE_NAME)
  IMAGE_PATH: ghcr.io/${{ github.repository }}/aigov-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required for pushing to GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: short-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (for tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PATH }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # Build from repository root
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        # AZURE_CREDENTIALS secret should contain:
        # {
        #   "clientId": "<service-principal-client-id>",
        #   "clientSecret": "<service-principal-secret>",
        #   "subscriptionId": "<azure-subscription-id>",
        #   "tenantId": "<azure-tenant-id>"
        # }
        # To create a service principal:
        # az ad sp create-for-rbac --name "aigov-github-actions" --role contributor --scopes /subscriptions/<subscription-id>/resourceGroups/<resource-group> --sdk-auth

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          # AZURE_WEBAPP_NAME secret should be the name of your Azure Web App resource
          images: ${{ env.IMAGE_PATH }}:sha-${{ steps.short-sha.outputs.sha_short }}
          # Use commit SHA for precise versioning and traceability

